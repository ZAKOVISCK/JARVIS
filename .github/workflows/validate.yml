name: Validate code
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare isolated development data and local database
        run: pnpm setup
      - name: Validate public repository, types, lint, tests and build
        run: pnpm check
